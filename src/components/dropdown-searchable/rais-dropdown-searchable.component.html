<div class="rais-search" [class.rais-search--open]="isOpen">
  <div class="rais-search__labels">
    <div class="rais-search__label-row">
      <span class="rais-search__label" [id]="labelId">{{ label }}</span>
      <span *ngIf="optional" class="rais-search__optional">(Optional)</span>
    </div>
    <span *ngIf="instructions" class="rais-search__instructions" [id]="instructionsId">{{ instructionsText }}</span>
  </div>

  <div
    class="rais-search__box"
    [class.rais-search__box--active]="isFocused"
    [class.rais-search__box--error]="isError"
  >
    <div class="rais-search__input-container">
      <input
        #input
        class="rais-search__input"
        type="text"
        role="combobox"
        autocomplete="off"
        aria-autocomplete="list"
        [attr.aria-expanded]="isOpen"
        [attr.aria-controls]="listboxId"
        [attr.aria-labelledby]="labelId"
        [attr.aria-describedby]="instructions ? instructionsId : null"
        [attr.aria-activedescendant]="activeOptionId"
        [attr.aria-invalid]="isError ? true : null"
        [placeholder]="placeholder"
        [value]="inputValue"
        (input)="onInput($event)"
        (focus)="onFocus()"
        (keydown)="onKeydown($event)"
      />
    </div>
    <div class="rais-search__icon-divider">
      <div class="rais-search__divider"></div>
      <button
        *ngIf="showClear"
        type="button"
        class="rais-search__icon rais-search__icon--clear"
        aria-label="Clear"
        (click)="clear()"
      ></button>
      <button
        *ngIf="!showClear"
        type="button"
        class="rais-search__icon rais-search__icon--caret"
        [class.rais-search__icon--open]="isOpen"
        [attr.aria-label]="isOpen ? 'Hide results' : 'Show results'"
        [attr.aria-expanded]="isOpen"
        [attr.aria-controls]="listboxId"
        tabindex="-1"
        (click)="toggle()"
      ></button>
    </div>
  </div>

  <rais-dropdown-menu-searchable
    *ngIf="isOpen"
    class="rais-search__menu"
    [options]="results"
    [selectedIndex]="selectedIndex"
    [activeIndex]="effectiveActiveIndex"
    [resultsState]="resultsState"
    [query]="query"
    [maxVisibleRows]="maxVisibleRows"
    [focusable]="false"
    [listboxId]="listboxId"
    [idPrefix]="listboxId"
    [ariaLabel]="label"
    (optionSelected)="onMenuSelected($event)"
    (closed)="close()"
  ></rais-dropdown-menu-searchable>

  <span *ngIf="isError" class="rais-search__error">{{ errorMessage }}</span>
</div>
